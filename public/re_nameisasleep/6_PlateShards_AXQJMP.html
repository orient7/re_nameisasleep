            const talks = [

                { type: 'narration', text: '***足音が近づいてくる。' },

                {
                    type: 'message',
                    speaker: 'Person9',
                    text: '皿が割れていますね……。',
                },

                { type: 'narration', text: '***さらに足音が近づいてくる。' },

                {
                    type: 'message',
                    speaker: 'Person21',
                    text: 'あ、イワマくん来てたんだね。\nなにか食料になりそうなものあった？',
                },
                {
                    type: 'message',
                    speaker: 'Person10',
                    text: 'おーい、タクロウもキッチン手伝ってくれよ。\n思ったより広くてさ。',
                },
                {
                    type: 'message',
                    speaker: 'Person24',
                    text: '僕は 「喰種」だ……！\n何も出来ないのは…もう嫌なんだ……。',
                },
                {
                    type: 'message',
                    speaker: 'Person10',
                    text: 'え……こわ。',
                },
                {
                    type: 'message',
                    speaker: 'Person24',
                    text: '僕は僕の大事な人を奪われたくない……。\nだから強くならなきゃいけないんだ……。',

                { type: 'message', speaker: 'Person14', text: 'おいおいカイト、何絡んでんの？' },
                { type: 'message', speaker: 'Person10', text: 'タクロウ！どこ行ってたんだよ。' },
                {
                    type: 'message',
                    speaker: 'Person14',
                    text: 'トイレ。水流れて助かったー。\nてかムテキ、何やってんだ？',

                {
                    type: 'message',

                    type: 'message',
                    speaker: 'Person9',

                    type: 'message',

                    text: 'これで開けたのか。刃にカレーつきっぱなしだぞ。',

                {
                    type: 'message',
                    speaker: 'Person21',

                { type: 'message', speaker: 'Person10', text: 'へーい。' },
                {
                    type: 'message',
                    speaker: 'Person14',

                {
                    type: 'message',
                    speaker: 'Person24',
                    text: '僕は人間なのにそれが食べたくて仕方がなくて……。',
                },
                {
                    type: 'message',
                    speaker: 'Person10',
                    text: 'お、これいいな。カレーに入れるか。',

                { type: 'message', speaker: 'Person21', text: 'ん？何入れたの？' },

                    type: 'message',
                    speaker: 'Person10',
                    text: '生レバー。具がなんかあったほうがいいだろ。',

                { type: 'message', speaker: 'Person21', text: '賞味期限ちゃんと見たよね？' },
                { type: 'message', speaker: 'Person10', text: '大丈夫だって。' },

                { type: 'narration', text: '***しばらく物を漁る音が続く。' },

                { type: 'message', speaker: 'Person21', text: 'カレー出来たよ！' },
                { type: 'message', speaker: 'Person14', text: '結構いいじゃん！' },

                    type: 'message',
                    speaker: 'Person10',
                    text: '腹減ったー。皆どっか行ってるし先食おうぜ。',

                    type: 'message',
                    speaker: 'Person21',
                    text: 'だね。カレーは4人分しかないし。\n……ちょっとタクロウ！あんたの分だけよそいすぎ！\n私とイワマくんのが少なくなっちゃうじゃん！',

                {
                    type: 'message',
                    speaker: 'Person14',
                    text: 'えっまじ？いつもより少なくしたんだけど。',
                },
                {
                    type: 'message',
                    speaker: 'Person24',
                    text: 'もう\n喰べたくない……。',
                },
                {
                    type: 'message',
                    speaker: 'Person21',
                    text: 'えー？喰種くん全然よそってないじゃん。\nはぁ、いいならいいけど。\n……じゃあ、いただきます！',
                },
            ];
