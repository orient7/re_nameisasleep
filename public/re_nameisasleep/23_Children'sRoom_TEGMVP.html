                // },
                // {

                {
                    type: 'message',
                    speaker: 'Person11',
                    text: 'これからどうする？',
                },
                {
                    type: 'message',
                    speaker: 'Person17',
                    text: 'ハヤト！なんでそんな冷静でいられんだよ！？',
                },
                {
                    type: 'message',
                    speaker: 'Person11',
                    text: '落ち着かなきゃやってらんねえだろ！',
                },
                {
                    type: 'message',
                    speaker: 'Person15',
                    text: 'まあそうだね。\n僕たちにできることは……この館から脱出すること……か。',
                },
                {
                    type: 'message',
                    speaker: 'Person4',

                {
                    type: 'message',
                    speaker: 'Person9',

                {

                    speaker: 'Person4',
                    text: 'そんなのどうやって！',

                {
                    type: 'message',
                    speaker: 'Person5',
                    text: '私もイワマさんと同じ考えよ。\nそれに…その支配人のことなんとなく分かる気がするの……。',
                },
                {
                    type: 'message',
                    speaker: 'Person15',
                    text: 'トモエさんはなにかわかるのかい？',

                {
                    type: 'message',

                {

                    speaker: 'Person15',

                {
                    type: 'message',
                    speaker: 'Person9',

                },
                {
                    type: 'message',
                    speaker: 'Person15',
                    text: 'いや…どっちも知らない著者だね……。',
                },
                {
                    type: 'message',
                    speaker: 'Person11',
                    text: 'おい！ここに日記らしきもんがあんぞ！',

                {
                    type: 'message',
                    speaker: 'Person9',
                    text: '読んでみましょう。',

                { type: 'narration', text: '***日記を読んでいるのか、沈黙が続く。' },

                    type: 'message',
                    speaker: 'Person15',

                {
                    type: 'message',

                {

                {

                    type: 'message',
                    speaker: 'Person15',
                    text: 'わかった。話せないことがあるなら聞かないでおこう。\nとりあえず、日記は元の場所に戻そう。',

                { type: 'narration', text: '' },
                { type: 'narration', text: '' },

                {
                    type: 'message',
                    speaker: 'Person9',
                    text: 'そういえばレインホールさんは……？',

                {
                    type: 'message',
                    speaker: 'Person11',
                    text: 'い、いない……。',

                {
                    type: 'message',
                    speaker: 'Person17',

                    type: 'message',
                    speaker: 'Person26',

                {
                    type: 'message',
                    speaker: 'Person5',
                    text: '……。',
                },

                { type: 'narration', text: '***発砲音。' },

                {
                    type: 'message',
                    speaker: 'Person9',
                    text: 'まずいですね。早く「けっとうじょう」の場所を特定しないと。',

                {
                    type: 'message',
                    speaker: 'Person5',
                    text: 'そういえば、ポケットの中にこんなものが入ってたの。',
                },
                {
                    type: 'message',
                    speaker: 'Person15',
                    text: 'これはでんじろう先生のスマホ？',
                },
                {
                    type: 'message',
                    speaker: 'Person5',
                    text: 'でも、パスワードがわからなくて……。',
                },
                {
                    type: 'message',
                    speaker: 'Person9',
                    text: '「はぴエネ」ですよ。',
                },
                {
                    type: 'message',
                    speaker: 'Person15',
                    text: 'え？',
                },
                {
                    type: 'message',
                    speaker: 'Person9',
                    text: 'パスワードは「はぴエネ（8280）」です。',
                },
                {
                    type: 'message',
                    speaker: 'Person17',
                    text: 'ほんとかよ。',
                },
                {
                    type: 'message',
                    speaker: 'Person5',
                    text: 'あ、開いた！',
                },

                { type: 'narration', text: '***しばらくスマホの内容を確認する。' },

                {
                    type: 'message',
                    speaker: 'Person15',
                    text: 'この館の支配人のことが書かれてるね。\n目的は復讐……日記の内容と一致するね。',

                {
                    type: 'message',
                    speaker: 'Person11',
                    text: 'この数字の暗号みてえなやつはなんだ……？\nx=……y=……z=……？',
                },
                {
                    type: 'message',
                    speaker: 'Person9',
                    text: 'たぶん座標だと思います。\nYがマイナスということは地下を表しているのでしょう。\nもしかしたら「けっとうじょう」の座標なのかもしれません。',
                },
                {
                    type: 'message',
                    speaker: 'Person17',
                    text: 'じゃあ、これからどうするんだ？',
                },
                // {
                //     type: 'message',
                //     speaker: 'Person5',
                //     text: '私…支配人が誰かわかった気がするの。',

                // {
                //     type: 'message',

                // },

                    type: 'message',
                    speaker: 'Person5',
                    text: '……私に作戦があるの。\nみんな協力してもらえる？\nこの館の支配人を説得する方法。',

                {
                    type: 'message',
                    speaker: 'Person9',
                    text: 'トモエさんについては不可解なことがあります。\n何かを隠してる気配もある……。\nだからこそ、何かに気づいているということですね。',

                {
                    type: 'message',
                    speaker: 'Person17',
                    text: 'その作戦で本当にいけんのか？',

                {
                    type: 'message',
                    speaker: 'Person11',
                    text: 'このまま死ぬなら、やるしかねえだろ。',

                    type: 'message',
                    speaker: 'Person19',
                    text: '一つまだ行っていない部屋があります。\nたぶんその部屋が、<b>そのための部屋</b>です。',

                { type: 'hr' },

                    type: 'message',
                    speaker: 'psychometry',
                    text: '音声記憶を元に探して見つけた日記と『祈りの力』を置いとくっす！',
